<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} — Asteroid Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; }
        main { flex: 1; display: flex; align-items: center; justify-content: center; }
        .error-card {
            text-align: center; padding: 3rem 2rem;
            border: 1px solid var(--pico-muted-border-color);
            border-radius: var(--pico-border-radius);
            max-width: 480px; width: 100%;
        }
        .error-code { font-size: 5rem; font-weight: 800; opacity: 0.15; line-height: 1; margin-bottom: 0.5rem; }
        .error-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; }
    </style>
</head>
<body>
    <header class="container">
        <a href="/">Asteroid Tracker &amp; Mission Planner</a>
    </header>
    <main class="container">
        <div class="error-card">
            <div class="error-code">{{ code }}</div>
            <div class="error-title">{{ title }}</div>
            <p>{{ message }}</p>
            <a href="/" role="button">Back to Home</a>
        </div>
    </main>
</body>
</html>
